services:
  game-list:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      PGHOST: db
      PGUSER: app
      PGDATABASE: app
      APP_REVISION: ${EXPECTED_REVISION:-unknown}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:8002}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      AUTH_GITHUB_ENABLED: ${AUTH_GITHUB_ENABLED:-false}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
    depends_on:
      db:
        condition: service_healthy
    secrets: [db_password, smtp_password, github_client_secret]
    ports:
      - "127.0.0.1:8002:8000"
    networks: [internal]
  db:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]
networks:
  internal:
    internal: true
volumes:
  pgdata: {}
secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password
  smtp_password:
    file: ${SECRETS_DIR:-./secrets}/smtp_password
  github_client_secret:
    file: ${SECRETS_DIR:-./secrets}/github_client_secret
